<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico">
<title>Argon I/O 문서고 — Han Lim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --ink:#141B26; --muted:#5A6577;
  --line:#D5DCE6; --accent:#2F45A8; --accent-ink:#FFFFFF; --accent-soft:#E2E7F8;
  --hit:#F7D76E; --hit-ink:#141B26; --ok:#2C7A4B; --ok-soft:#E0F1E7; --warn:#9A6200; --warn-soft:#F7EBD3;
  --code-bg:#EEF1F6;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131A; --surface:#151C26; --surface-2:#1C2533; --ink:#E4E9F1; --muted:#97A3B6;
    --line:#2A3445; --accent:#97A9FF; --accent-ink:#0E131A; --accent-soft:#222B4A;
    --hit:#7C6214; --hit-ink:#FFF6D6; --ok:#7FD3A0; --ok-soft:#173326; --warn:#E8B45C; --warn-soft:#3A2C12;
    --code-bg:#1A2230;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131A; --surface:#151C26; --surface-2:#1C2533; --ink:#E4E9F1; --muted:#97A3B6;
  --line:#2A3445; --accent:#97A9FF; --accent-ink:#0E131A; --accent-soft:#222B4A;
  --hit:#7C6214; --hit-ink:#FFF6D6; --ok:#7FD3A0; --ok-soft:#173326; --warn:#E8B45C; --warn-soft:#3A2C12;
  --code-bg:#1A2230;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* app frame */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.search{flex:1;display:flex;justify-content:flex-end;min-width:0}
.search input{width:100%;max-width:420px;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink)}
.menu-btn{display:none;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100% - 52px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px;overflow-y:auto;
  position:sticky;top:52px;height:calc(100vh - 52px)}
.side h4{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
.nav-item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:5px 8px;border-radius:5px;
  color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.45}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--accent-soft);color:var(--ink)}
.nav-item .no{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;width:2.6em}
details.dom{margin:1px 0}
details.dom>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:5px;font-size:13.5px;font-weight:500}
details.dom>summary::-webkit-details-marker{display:none}
details.dom>summary:hover{background:var(--surface-2)}
details.dom>summary .no{font-family:var(--mono);font-size:11.5px;color:var(--accent);width:2.6em;flex:none}
details.dom>summary .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
details.dom .nav-item{padding-left:20px}
main{min-width:0;padding-inline:16px;padding-block:28px 80px}
.wrap{max-width:1180px;margin:0 auto}

/* home */
.hero{display:grid;gap:10px;margin-bottom:26px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hero h1{font-family:var(--cond);font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:0;max-width:68ch;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:6px 0 30px;padding:14px 0;border-block:1px solid var(--line)}
.stat{display:grid}
.stat b{font-family:var(--cond);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.sec-title{font-family:var(--cond);font-weight:600;font-size:20px;margin:30px 0 4px}
.sec-sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:72ch}
.stack{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.layer .lname{font-family:var(--cond);font-weight:600;font-size:14px}
.layer .ldesc{font-size:12px;color:var(--muted);line-height:1.5}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-decoration:none;color:var(--ink);min-width:0;max-width:300px}
.tile:hover{border-color:var(--accent)}
.tile .tno{font-family:var(--mono);font-size:11px;color:var(--accent)}
.tile .ttl{font-size:13px;line-height:1.4}
.doms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dom-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:6px;align-content:start}
.dom-card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline}
.dom-card h3 .no{font-family:var(--mono);font-size:12px;color:var(--accent)}
.dom-card ol{margin:0;padding-left:1.4em;font-size:13px;line-height:1.55}
.dom-card ol a{color:var(--ink);text-decoration:none}
.dom-card ol a:hover{color:var(--accent);text-decoration:underline}

/* doc view */
.docgrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:36px}
.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow-y:auto;font-size:12.5px;line-height:1.45;border-left:1px solid var(--line);padding-left:12px}
.toc b{display:block;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}
.toc a.h3{padding-left:10px}
.toc a:hover{color:var(--accent)}
.crumbs{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.md{max-width:78ch}
.md h1{font-family:var(--cond);font-weight:600;font-size:clamp(24px,3.2vw,32px);line-height:1.2;margin:0 0 18px;text-wrap:balance}
.md h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:40px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.md h3{font-size:17px;margin:28px 0 8px}
.md h4{font-size:15px;margin:22px 0 6px}
.md p,.md li{max-width:72ch}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.1em .35em;border-radius:3px;overflow-wrap:anywhere}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:6px;overflow-x:auto;line-height:1.5;font-size:13px}
.md pre code{background:none;padding:0;overflow-wrap:normal}
.md blockquote{margin:16px 0;padding:6px 16px;border-left:3px solid var(--accent);background:var(--surface);color:var(--ink)}
.md blockquote p{margin:6px 0}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.md table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
.md th,.md td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.md th{background:var(--surface-2);font-weight:600;white-space:nowrap}
.md tr:last-child td{border-bottom:none}
.md a.xref{font-family:var(--mono);font-size:.9em;text-decoration:none;background:var(--accent-soft);padding:0 .3em;border-radius:3px}
.tag-unv{font-family:var(--mono);font-size:.78em;color:var(--warn);background:var(--warn-soft);padding:0 .35em;border-radius:3px;white-space:nowrap}
mark{background:var(--hit);color:var(--hit-ink);border-radius:2px}

/* search + timeline */
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.panel-head h1{font-family:var(--cond);font-weight:600;font-size:28px;margin:0;margin-right:auto}
.result{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.result a{font-weight:500;text-decoration:none}
.result .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.result .snip{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.tl-controls{display:grid;gap:10px;margin-bottom:12px}
.tl-controls input,.tl-controls select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl-count{font-family:var(--mono);font-size:12px;color:var(--muted)}
table.tl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.tl th,table.tl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tl th{background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
table.tl td.v,table.tl td.d{font-family:var(--mono);font-size:12px;white-space:nowrap}
.kind{font-family:var(--mono);font-size:11px;padding:0 .4em;border-radius:3px;background:var(--surface-2);white-space:nowrap}
.kind.added{background:var(--ok-soft);color:var(--ok)}
.kind.removed{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);padding:20px 0}

@media (max-width:1180px){.docgrid{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:52px;left:0;width:min(320px,88vw);z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateX(-102%);transition:transform .18s ease}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .brand span{display:none}
  .layer{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

async function loadDoc(id){
  if (cache[id]) return cache[id];
  const r = await fetch(DOCS[id].path);
  if (!r.ok) throw new Error(r.status);
  return (cache[id] = await r.text());
}

function linkXrefs(md){
  // (→ 06/03, 08/02) 형태와 synthesis/00 표기를 링크로 바꾼다
  md = md.replace(/→\s*((?:[0-9]{2}\/[0-9]{2}(?:\s*[,·]\s*|\s*(?:및|와|과)\s*)?)+)/g, (m, grp) =>
    '→ ' + grp.replace(/([0-9]{2})\/([0-9]{2})/g, (x,a,b) => DOCS[`d-${a}-${b}`] ? `[${a}/${b}](#d-${a}-${b})` : x));
  md = md.replace(/(^|[^\w\/\[])synthesis\/(0[0-9])\b/g, (m,pre,n) => DOCS[`s-${n}`] ? `${pre}[synthesis/${n}](#s-${n})` : m);
  return md;
}

async function viewDoc(id, hl){

  }</div><div class="md" id="md">${html}</div></article><aside class="toc" id="toc"></aside></div>`;
  const root = $('#md');
  root.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className='tbl'; t.replaceWith(w); w.appendChild(t); });

  root.querySelectorAll('a[href^="#d-"],a[href^="#s-"],a[href^="#x-"]').forEach(a => a.classList.add('xref'));
  tagUnverified(root);
  const heads = [...root.querySelectorAll('h2,h3')];
  heads.forEach((h,i) => h.id = 'h' + i);

  $('#toc').addEventListener('click', e => { const a = e.target.closest('a[data-h]'); if (!a) return; e.preventDefault(); document.getElementById('h'+a.dataset.h).scrollIntoView({behavior:'smooth', block:'start'}); });
  markNav(id); document.title = d.short + ' · Argon I/O 문서고';
  window.scrollTo(0,0);
  if (hl) highlight(root, hl);
}

function tagUnverified(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (w.nextNode()) if (w.currentNode.nodeValue.includes('[추측/미확인]')) hits.push(w.currentNode);
  for (const n of hits){
    const parts = n.nodeValue.split('[추측/미확인]');
    const frag = document.createDocumentFragment();
    parts.forEach((p,i) => { frag.append(p); if (i < parts.length-1){ const s = document.createElement('span'); s.className='tag-unv'; s.textContent='추측/미확인'; frag.append(s);} });
    n.replaceWith(frag);
  }
}

function highlight(root, term){
  const t = term.toLowerCase(); let first = null, count = 0;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){
    if (count > 300) break;
    const v = n.nodeValue, lv = v.toLowerCase(); let i = lv.indexOf(t); if (i < 0) continue;
    const frag = document.createDocumentFragment(); let last = 0;
    while (i >= 0){ frag.append(v.slice(last,i)); const m = document.createElement('mark'); m.textContent = v.slice(i,i+t.length); frag.append(m); first ??= m; count++; last = i+t.length; i = lv.indexOf(t,last); }
    frag.append(v.slice(last)); n.replaceWith(frag);
  }
  if (first) first.scrollIntoView({block:'center'});
}

async function viewSearch(term){
  markNav('search');
  term = (term||'').trim();
  $('#view').innerHTML = `<div class="panel-head"><h1>검색</h1></div><div id="sres" class="empty">${term ? '전체 문서를 읽는 중…' : '위 검색창에 함수명, 플래그, 프로젝트 이름을 입력하세요. 예: <code>IORING_SETUP_DEFER_TASKRUN</code>, <code>nvme_uring_cmd</code>, <code>min_alloc_size</code>'}</div>`;
  if (!term) return;
  const ids = MANIFEST.docs.map(d => d.id);
  await Promise.all(ids.map(id => loadDoc(id).catch(()=>'')));
  const t = term.toLowerCase(); const out = [];
  for (const id of ids){
    const txt = cache[id] || ''; const lt = txt.toLowerCase();
    let i = lt.indexOf(t), n = 0; const snips = [];
    while (i >= 0){ n++; if (snips.length < 2){ const a = Math.max(0,i-70), b = Math.min(txt.length, i+t.length+90); snips.push([txt.slice(a,i), txt.slice(i,i+t.length), txt.slice(i+t.length,b)]); } i = lt.indexOf(t, i+t.length); }
    if (n) out.push({id,n,snips});
  }
  out.sort((a,b) => b.n - a.n);
  const el = $('#sres'); el.className = '';
  if (!out.length){ el.innerHTML = `<div class="empty">“${esc(term)}”이(가) 들어간 문서가 없습니다. 영문 식별자는 대소문자를 구분하지 않습니다.</div>`; return; }
  el.innerHTML = `<div class="tl-count">${out.length}개 문서, ${out.reduce((s,r)=>s+r.n,0)}곳</div>` + out.map(r => {
    const d = DOCS[r.id];
    return `<div class="result"><a href="#${r.id}" data-hl="${esc(term)}">${esc(d.short)}</a><div class="meta">${d.code} · ${r.n}곳</div>${
      r.snips.map(s => `<div class="snip">…${esc(s[0].replace(/\s+/g,' '))}<mark>${esc(s[1])}</mark>${esc(s[2].replace(/\s+/g,' '))}…</div>`).join('')}</div>`;
  }).join('');
}

function viewTimeline(){
  markNav('timeline');
  if (!TIMELINE || !TIMELINE.rows.length){ $('#view').innerHTML = '<div class="empty">연표 데이터가 아직 없습니다.</div>'; return; }
  const projCount = {}; TIMELINE.rows.forEach(r => projCount[r.project] = (projCount[r.project]||0)+1);
  const projs = Object.keys(projCount).sort((a,b) => projCount[b]-projCount[a]);
  const kinds = [...new Set(TIMELINE.rows.map(r=>r.kind))].sort();

  $('#tlQ').addEventListener('input', e => { tlState.q = e.target.value.toLowerCase(); drawTimeline(); });

function verKey(v){ return (v.match(/\d+/g)||[]).map(n => n.padStart(6,'0')).join('.'); }
function drawTimeline(){
  let rows = TIMELINE.rows.filter(r =>
    (!tlState.proj.size || tlState.proj.has(r.project)) && (!tlState.kind || r.kind === tlState.kind) &&
    (!tlState.q || (r.event + ' ' + r.version + ' ' + r.project).toLowerCase().includes(tlState.q)));
  rows = rows.slice().sort(tlState.sort === 'date'
    ? (a,b) => (a.date||'9999').localeCompare(b.date||'9999') || a.project.localeCompare(b.project) || verKey(a.version).localeCompare(verKey(b.version))
    : (a,b) => a.project.localeCompare(b.project) || verKey(a.version).localeCompare(verKey(b.version)));
  $('#tlCount').textContent = `${rows.length} / ${TIMELINE.rows.length}`;
  const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  $('#tlBody').innerHTML = rows.map(r => `<tr><td class="d">${esc(r.date||'—')}</td><td>${esc(r.project)}</td><td class="v">${esc(r.version||'—')}</td><td>${md(r.event)}${r.confidence==='unverified'?' <span class="tag-unv">추측/미확인</span>':''}</td><td><span class="kind ${esc(r.kind)}">${esc(r.kind)}</span></td><td class="v">${
    r.sources.map(s => DOCS[s] ? `<a href="#${s}">${DOCS[s].code}</a>` : esc(s)).join(' ')}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">조건에 맞는 항목이 없습니다.</td></tr>';
}

/* ---------- router ---------- */
let pendingHl = null;
function route(){
  const h = location.hash.slice(1) || 'home';
  closeSide();
  if (h === 'home') return viewHome();
  if (h === 'timeline') return viewTimeline();
  if (h === 'search') return viewSearch($('#q').value);
  if (DOCS[h]){ const hl = pendingHl; pendingHl = null; return viewDoc(h, hl); }
  viewHome();
}
document.addEventListener('click', e => { const a = e.target.closest('a[data-hl]'); if (a) pendingHl = a.dataset.hl; });
$('#q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (location.hash !== '#search') location.hash = 'search'; else viewSearch(e.target.value); }, 280);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter'){ clearTimeout(searchTimer); location.hash === '#search' ? viewSearch(e.target.value) : (location.hash = 'search'); } });
function closeSide(){ $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').addEventListener('click', () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });
window.addEventListener('hashchange', route);
$('#brandMeta').textContent = `${STATS.docs} docs · Linux ${STATS.kernel}`;
buildSide();
route();
</script>
</body>
</html>

# 1. Global Configuration (전역 설정)
baseURL = 'https://007limhan.com/'
theme = 'PaperMod'

# 글로벌 리모트 채용 대비: 영어를 기본 언어로 두어 루트(/)에 배치, 한국어는 /ko/
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false
buildExpired = false

# RSS: 피드 항목 수 제한 없음 (본문 전문은 params.ShowFullTextinRSS)
[services.rss]
  limit = -1

[pagination]
  pagerSize = 10

# 2. Taxonomies (카테고리/태그 체계 명시)
[taxonomies]
  category = 'categories'
  tag = 'tags'
  layer = 'layers'

# 3. Markup (기술 블로그용 코드 하이라이팅 - PaperMod의 테마 연동 CSS 사용)
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

# 4. PaperMod Theme Specific Configuration (테마 기능 설정)
[params]
  defaultTheme = 'auto'
  ShowShareButtons = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  # 홈 목록은 측정 글 기준
  mainSections = ['measurements']
  # ToC는 measurements 섹션에서만 켠다 (content/measurements/_index.md의 cascade)
  ShowToc = false
  TocOpen = false
  ShowFullTextinRSS = true

  author = 'Han Im'

  # SEO: 링크 공유 시 기본 썸네일 (원본 SVG는 static/og-image.svg에 소스로 보관)
  images = ['og-image.png']

  keywords = [
    'Ceph', 'RGW', 'RADOS', 'BlueStore', 'distributed storage',
    'io_uring', 'liburing', 'blk-mq', 'NVMe', 'Linux I/O stack', 'network stack', 'RoCEv2',
    'eBPF', 'bpftrace', 'fio', 'storage performance', 'measurement',
  ]

  # 소셜 링크 (푸터의 Hugo/PaperMod 크레딧은 유지 - 파셜 오버라이드 없음)
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Lim-Han'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/han-im-cloud/'

# 5. i18n Configuration (다국어 라우팅 및 메타데이터)
[languages]
  [languages.en]
    languageName = 'EN'
    languageCode = 'en-us'
    weight = 1
    title = 'Han Im'
    [languages.en.params]
      description = 'Distributed storage engineer (Ceph RGW → RADOS). Measurements down the node I/O stack — io_uring, blk-mq, NVMe, network — with prediction, raw data and repro.'
      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm Han Im 👋"
        Content = """
Distributed storage engineer who measures down to the node I/O stack. I work on Ceph (RGW → RADOS), and instrument io_uring, blk-mq, NVMe and the network stack with eBPF — digging only into the layer that is actually in the way.

Every measurement here starts with a written prediction and ends with the raw data and a way to rerun it.
"""
    [languages.en.menus]
      [[languages.en.menus.main]]
        identifier = 'measurements'
        name = 'Measurements'
        url = '/measurements/'
        weight = 10
      [[languages.en.menus.main]]
        identifier = 'upstream'
        name = 'Upstream'
        url = '/upstream/'
        weight = 20
      [[languages.en.menus.main]]
        identifier = 'lab'
        name = 'Lab'
        url = '/lab/'
        weight = 30
      [[languages.en.menus.main]]
        identifier = 'learn'
        name = 'Learn'
        url = '/learn/'
        weight = 35
      [[languages.en.menus.main]]
        identifier = 'about'
        name = 'About'
        url = '/about/'
        weight = 40

  [languages.ko]
    languageName = 'KO'
    languageCode = 'ko-kr'
    weight = 2
    title = '임한'
    [languages.ko.params]
      description = '분산 스토리지 엔지니어(Ceph RGW → RADOS). 노드 I/O 스택(io_uring·blk-mq·NVMe·네트워크)까지 예측·원본 데이터·재현 방법과 함께 계측한 기록.'
      [languages.ko.params.homeInfoParams]
        Title = "안녕하세요, 임한입니다 👋"
        Content = """
노드 I/O 스택까지 계측하는 분산 스토리지 엔지니어입니다. Ceph(RGW → RADOS)를 다루고, io_uring·blk-mq·NVMe·네트워크 스택을 eBPF로 계측해 실제로 막히는 층만 팝니다.

글은 대부분 영어로 씁니다. 모든 측정은 미리 적어 둔 예측에서 시작해 원본 데이터와 재현 방법으로 끝납니다.
"""

    # ko는 보조 언어(번역 parity 없음). en에만 있는 페이지는 noLangPrefix로 /ko/ 접두사 없이 연결한다.
    # (layouts/partials/header.html 오버라이드에서 처리)
    [languages.ko.menus]
      [[languages.ko.menus.main]]
        identifier = 'measurements'
        name = 'Measurements'
        url = '/measurements/'
        weight = 10
        [languages.ko.menus.main.params]
          noLangPrefix = true
      [[languages.ko.menus.main]]
        identifier = 'upstream'
        name = 'Upstream'
        url = '/upstream/'
        weight = 20
        [languages.ko.menus.main.params]
          noLangPrefix = true
      [[languages.ko.menus.main]]
        identifier = 'lab'
        name = 'Lab'
        url = '/lab/'
        weight = 30
        [languages.ko.menus.main.params]
          noLangPrefix = true
      [[languages.ko.menus.main]]
        identifier = 'learn'
        name = 'Learn'
        url = '/learn/'
        weight = 35
        [languages.ko.menus.main.params]
          noLangPrefix = true
      [[languages.ko.menus.main]]
        identifier = 'about'
        name = '소개'
        url = '/about/'
        weight = 40
